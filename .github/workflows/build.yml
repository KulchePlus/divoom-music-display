name: Windows build and release

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build from a fresh environment
        shell: pwsh
        run: ./Build.ps1 -Python python
      - name: Run offline checks (no Bluetooth uploads)
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Package portable release
        shell: pwsh
        run: ./.venv/Scripts/python.exe scripts/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "Divoom $TAG" --notes-file "docs/releases/$TAG.md" --latest
          else
            gh release create "$TAG" release/* --verify-tag --title "Divoom $TAG" --notes-file "docs/releases/$TAG.md" --latest
          fi
